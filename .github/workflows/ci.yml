name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
        node-version: ['20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python-version }}, cache: 'pip' }
      - uses: actions/setup-node@v4
        with: { node-version: ${{ matrix.node-version }}, cache: 'npm', cache-dependency-path: apps/dashboard/package-lock.json }
      - run: python -m venv .venv
      - run: . .venv/bin/activate && pip install -e ./apps/api[dev]
      - run: cd apps/dashboard && npm ci
      - run: make verify
